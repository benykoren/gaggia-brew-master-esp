[platformio]
default_envs = esp32-s3-devkitc-1

; --- Primary target: ESP32-S3-DevKitC-1 (N16R8: 16MB flash, 8MB OPI PSRAM) ---
[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; N16R8 uses Octal (OPI) PSRAM; qio_opi matches this module.
board_build.arduino.memory_type = qio_opi
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
;	-D CORE_DEBUG_LEVEL=5
build_src_filter = +<*> -<sniffer.cpp>

lib_deps =
    br3ttb/PID @ ^1.2.1
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8

; --- Diagnostic: UART sniffer to reverse-engineer the temperature module ---
; Compiles ONLY src/sniffer.cpp (excludes the main app), so it has its own
; setup()/loop(). Flash with: pio run -e esp32-s3-sniffer -t upload
[env:esp32-s3-sniffer]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
build_src_filter = +<*> -<main.cpp> -<web.cpp> -<mqtt.cpp>

; --- Original board kept for reference (ESP32-C6-DevKitC-1) ---
[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-c6-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
;	-D CORE_DEBUG_LEVEL=5

lib_deps =
    adafruit/Adafruit MAX31865 library @ ^1.6.0
    br3ttb/PID @ ^1.2.1
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8
